[[app]]
name = "Liferay Developer Studio"
category = "sviluppo"
detect.files = ['%ProgramFiles%\LiferayDevStudio\*\DeveloperStudio.exe']
paths = [ { path = '%ProgramFiles%\LiferayDevStudio', kind = "app" } ]
notes = "Eclipse per Liferay installato da zip (senza installer)."

[ignore]
# Nomi di cartella da non segnalare mai
names = []
# Percorsi completi da non segnalare (accettano %VARIABILI%)
paths = []
