# ============================== Utilities ==============================

[[app]]
name = "Syncthing"
category = "utilities"
detect.names = ["Syncthing*", "com.github.xor-gate.syncthing*", "syncthing"]
detect.exe = ["syncthing"]
paths = [
  { path = '~/Library/Application Support/Syncthing', kind = "data" },
  { path = '~/Sync', kind = "data" },
]
notes = "Sync is the default synchronized folder: it may contain your files."

[[app]]
name = "Obsidian"
category = "utilities"
detect.names = ["Obsidian*", "md.obsidian*"]
paths = [ { path = '~/Library/Application Support/obsidian', kind = "config" } ]
notes = "Notes (vaults) are in a folder chosen by the user, not here."

[[app]]
name = "Dropbox"
category = "utilities"
detect.names = ["Dropbox*", "com.getdropbox.dropbox*"]
paths = [
  { path = '~/.dropbox', kind = "app" },
  { path = '~/Library/Application Support/Dropbox', kind = "app" },
]
