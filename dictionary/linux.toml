# ============================== Utilities ==============================

[[app]]
name = "Syncthing"
category = "utilities"
detect.names = ["syncthing*"]
detect.exe = ["syncthing"]
paths = [
  { path = '~/.config/syncthing', kind = "config" },
  { path = '~/.local/state/syncthing', kind = "data" },
  { path = '~/Sync', kind = "data" },
]
notes = "Sync is the default synchronized folder: it may contain your files."

[[app]]
name = "Obsidian"
category = "utilities"
detect.names = ["obsidian*", "md.obsidian.*"]
detect.exe = ["obsidian"]
paths = [ { path = '~/.config/obsidian', kind = "config" } ]
notes = "Notes (vaults) are in a folder chosen by the user, not here."

[[app]]
name = "Dropbox"
category = "utilities"
detect.names = ["dropbox*", "com.dropbox.*"]
detect.exe = ["dropbox"]
paths = [
  { path = '~/.dropbox', kind = "app" },
  { path = '~/.dropbox-dist', kind = "app" },
]
