# Husk dictionary of known programs (Linux)
#
# Same format as windows.toml (see the header of that file and CONTRIBUTING.md).
# Paths accept ~, $VARIABLES, ${VARIABLES} and wildcards.
# detect.names is matched against packages (dpkg, rpm, pacman, Flatpak, Snap)
# and against menu application names (.desktop files).

# ============================== AI ==============================

[[app]]
name = "Ollama"
category = "ai"
detect.names = ["ollama*"]
detect.exe = ["ollama"]
paths = [ { path = '~/.ollama', kind = "models" } ]
notes = "The system service keeps its models in /usr/share/ollama."

[[app]]
name = "LM Studio"
category = "ai"
detect.names = ["LM Studio*", "lm-studio*"]
detect.exe = ["lms"]
paths = [
  { path = '~/.lmstudio', kind = "models" },
  { path = '~/.cache/lm-studio', kind = "models" },
  { path = '~/.config/LM Studio', kind = "config" },
]

[[app]]
name = "Cursor"
category = "ai"
detect.names = ["Cursor*"]
detect.exe = ["cursor"]
paths = [
  { path = '~/.cursor', kind = "config" },
  { path = '~/.config/Cursor', kind = "config" },
]

[[app]]
name = "Claude Code"
category = "ai"
detect.exe = ["claude"]
paths = [
  { path = '~/.claude', kind = "config" },
  { path = '~/.local/share/claude', kind = "app" },
]

[[app]]
name = "Aider"
category = "ai"
detect.exe = ["aider"]
paths = [
  { path = '~/.aider', kind = "cache" },
  { path = '~/.aider.conf.yml', kind = "config" },
]

[[app]]
name = "Cline"
category = "ai"
detect.exe = ["cline"]
paths = [ { path = '~/.cline', kind = "data" } ]

# ============================== Shared folders ==============================

[[shared]]
name = "Hugging Face cache"
path = '~/.cache/huggingface'
kind = "models"
used_by = "Python libraries (transformers, diffusers), ComfyUI, WebUI and others"
clean = "huggingface-cli delete-cache"

[[shared]]
name = "PyTorch Hub cache"
path = '~/.cache/torch'
kind = "models"
used_by = "PyTorch and programs based on it"

[[shared]]
name = "Python library caches"
paths = [
  { path = '~/.cache/pip', kind = "cache" },
  { path = '~/.matplotlib', kind = "cache" },
  { path = '~/.cache/matplotlib', kind = "cache" },
  { path = '~/.triton', kind = "cache" },
  { path = '~/nltk_data', kind = "models" },
]
used_by = "pip, Matplotlib, Triton (PyTorch), NLTK"

[[shared]]
name = "Thumbnail cache"
path = '~/.cache/thumbnails'
kind = "cache"
used_by = "file managers and image viewers"

[[shared]]
name = "Fyne app data"
paths = [
  { path = '~/.config/fyne', kind = "config" },
  { path = '~/.cache/fyne', kind = "cache" },
]
used_by = "programs built with the Fyne toolkit (Husk included): one subfolder per application ID"

[[shared]]
name = "User executables"
path = '~/.local/bin'
kind = "app"
used_by = "command-line tools installed per user (pip, pipx, uv, Claude Code, ...); many shell profiles add it to PATH"

[[shared]]
name = "Java crash files"
paths = [
  { path = '~/hs_err_pid*.log', kind = "logs" },
  { path = '~/replay_pid*.log', kind = "logs" },
  { path = '~/java_pid*.hprof', kind = "dump" },
]
used_by = "any Java program that crashed while started from the home folder"

# ============================== Development ==============================

[[app]]
name = "Node.js"
category = "development"
detect.names = ["nodejs*", "node"]
detect.exe = ["node"]
paths = [
  { path = '~/.npm', kind = "cache" },
  { path = '~/.node-gyp', kind = "cache" },
  { path = '~/.cache/node-gyp', kind = "cache" },
  { path = '~/.nvm', kind = "app" },
]
clean = "npm cache clean --force"

[[app]]
name = "Bun"
category = "development"
detect.exe = ["bun"]
paths = [ { path = '~/.bun', kind = "app" } ]

[[app]]
name = "Rust"
category = "development"
detect.names = ["rust*", "cargo*"]
detect.exe = ["cargo", "rustup", "rustc"]
paths = [
  { path = '~/.cargo', kind = "app" },
  { path = '~/.rustup', kind = "app" },
]

[[app]]
name = ".NET SDK"
category = "development"
detect.names = ["dotnet*", "Microsoft .NET SDK*"]
detect.exe = ["dotnet"]
paths = [
  { path = '~/.dotnet', kind = "app" },
  { path = '~/.nuget', kind = "cache" },
]
clean = "dotnet nuget locals all --clear"

[[app]]
name = "Go"
category = "development"
detect.names = ["golang*"]
detect.exe = ["go"]
paths = [
  { path = '~/go', kind = "data" },
  { path = '~/.cache/go-build', kind = "cache" },
]
clean = "go clean -cache -modcache"

[[app]]
name = "uv"
category = "development"
detect.exe = ["uv"]
paths = [
  { path = '~/.cache/uv', kind = "cache" },
  { path = '~/.local/share/uv', kind = "app" },
]
clean = "uv cache clean"

[[app]]
name = "Java / Gradle / Maven"
category = "development"
detect.names = ["*jdk*", "*openjdk*", "gradle*", "maven*"]
detect.exe = ["java", "gradle", "mvn"]
paths = [
  { path = '~/.gradle', kind = "cache" },
  { path = '~/.m2', kind = "cache" },
]

[[app]]
name = "Docker"
category = "development"
detect.names = ["docker*", "Docker Desktop*"]
detect.exe = ["docker"]
paths = [ { path = '~/.docker', kind = "config" } ]

[[app]]
name = "Visual Studio Code"
category = "development"
detect.names = ["code", "code-oss", "Visual Studio Code*", "com.visualstudio.code*"]
detect.exe = ["code"]
paths = [
  { path = '~/.vscode', kind = "config" },
  { path = '~/.config/Code', kind = "config" },
]

[[app]]
name = "JetBrains IDE"
category = "development"
detect.names = ["*jetbrains*", "intellij*", "pycharm*", "webstorm*", "phpstorm*", "goland*", "clion*", "rider*"]
paths = [
  { path = '~/.config/JetBrains', kind = "config" },
  { path = '~/.cache/JetBrains', kind = "cache" },
  { path = '~/.local/share/JetBrains', kind = "app" },
  { path = '~/java_error_in_*.hprof', kind = "dump" },
  { path = '~/java_error_in_*.log', kind = "logs" },
]

[[app]]
name = "Eclipse IDE"
category = "development"
detect.names = ["eclipse*", "org.eclipse.*"]
detect.exe = ["eclipse"]
paths = [
  { path = '~/.eclipse', kind = "config" },
  { path = '~/.p2', kind = "cache" },
]

