# Husk dictionary of known programs (Windows)
#
# [[app]]      a program: when it is not detected as installed, its folders are orphans
#   name            display name; an entry with the same name in apps.user.toml extends this one:
#                   detect and paths are merged, category, notes and clean (when set) replace these
#   category        ai, development, browser, communication, games, multimedia, utilities, ...
#   detect.names    patterns (* and ?) matched against registry, Store and Start menu names
#   detect.exe      executables looked up in PATH (without extension)
#   detect.files    files or folders whose presence means the program is installed
#   paths           program folders: { path = '...', kind = "..." }
#                   kind: app, config, cache, models, logs, data (user data: careful!)
#   notes, clean    free notes and the suggested cleanup command
#
# [[shared]]   caches used by several programs: listed separately, never as orphans
#
# Paths accept %VARIABLES% and wildcards. Use single-quoted strings
# so backslashes do not need to be doubled.
# Prefer first-level folders under the scanned roots
# (e.g. %APPDATA%\Name): deeper folders are reported on their parent folder.

# ============================== AI ==============================

[[app]]
name = "LM Studio"
category = "ai"
detect.names = ["LM Studio*"]
detect.exe = ["lms"]
detect.files = ['%LOCALAPPDATA%\Programs\LM Studio\LM Studio.exe']
paths = [
  { path = '%USERPROFILE%\.lmstudio', kind = "models" },
  { path = '%USERPROFILE%\.cache\lm-studio', kind = "models" },
  { path = '%APPDATA%\LM Studio', kind = "config" },
  { path = '%LOCALAPPDATA%\Programs\LM Studio', kind = "app" },
  { path = '%LOCALAPPDATA%\lm-studio-updater', kind = "cache" },
]
notes = "The models folder can be moved in the settings."

