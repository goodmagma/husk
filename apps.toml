# Dizionario dei programmi noti per Husk (husk.py, Windows)
#
# [[app]]      un programma: se non viene rilevato come installato, le sue cartelle sono orfane
#   name            nome visualizzato (unico: una voce con lo stesso nome in apps.user.toml la sostituisce)
#   category        ai, sviluppo, browser, comunicazione, giochi, multimedia, utilità, ...
#   detect.names    pattern (* e ?) confrontati con i nomi di registro, Store e menu Start
#   detect.exe      eseguibili cercati nel PATH (senza estensione)
#   detect.files    file o cartelle la cui presenza indica il programma installato
#   paths           cartelle del programma: { path = '...', kind = "..." }
#                   kind: app, config, cache, models, logs, data (dati utente: attenzione!)
#   notes, clean    note libere e comando consigliato per la pulizia
#
# [[shared]]   cache usate da più programmi: segnalate a parte, mai come orfane
#
# I percorsi accettano %VARIABILI% e caratteri jolly. Usa stringhe tra apici singoli
# per non dover raddoppiare le barre rovesciate.
# Conviene indicare cartelle al primo livello sotto le radici analizzate
# (es. %APPDATA%\Nome): le cartelle più profonde vengono annotate sulla cartella madre.

# ============================== AI ==============================

[[app]]
name = "LM Studio"
category = "ai"
detect.names = ["LM Studio*"]
detect.exe = ["lms"]
detect.files = ['%LOCALAPPDATA%\Programs\LM Studio\LM Studio.exe']
paths = [
  { path = '%USERPROFILE%\.lmstudio', kind = "models" },
  { path = '%USERPROFILE%\.cache\lm-studio', kind = "models" },
  { path = '%APPDATA%\LM Studio', kind = "config" },
  { path = '%LOCALAPPDATA%\Programs\LM Studio', kind = "app" },
  { path = '%LOCALAPPDATA%\lm-studio-updater', kind = "cache" },
]
notes = "La cartella dei modelli può essere spostata dalle impostazioni."

